components:
  schemas:
    AnswerResponse:
      properties:
        answer:
          title: Answer
          type: string
        answer_status:
          enum:
          - answered
          - insufficient_evidence
          title: Answer Status
          type: string
        cards:
          items:
            $ref: '#/components/schemas/CardResult'
          title: Cards
          type: array
        claims:
          items:
            $ref: '#/components/schemas/AtomicClaim'
          title: Claims
          type: array
        evidence:
          items:
            $ref: '#/components/schemas/EvidenceResult'
          title: Evidence
          type: array
        profile:
          enum:
          - card_page_section_benefit
          - parent_child_bundle
          title: Profile
          type: string
        query_type:
          enum:
          - proper_noun
          - numeric_condition
          - semantic
          title: Query Type
          type: string
        recommendations:
          items:
            $ref: '#/components/schemas/Recommendation'
          title: Recommendations
          type: array
        release_id:
          title: Release Id
          type: string
        status:
          const: completed
          title: Status
          type: string
        usage:
          $ref: '#/components/schemas/AnswerUsage'
      required:
      - status
      - answer_status
      - release_id
      - profile
      - query_type
      - cards
      - answer
      - recommendations
      - claims
      - evidence
      - usage
      title: AnswerResponse
      type: object
    AnswerUsage:
      properties:
        answer:
          additionalProperties: true
          title: Answer
          type: object
        embedding:
          additionalProperties: true
          title: Embedding
          type: object
      required:
      - embedding
      - answer
      title: AnswerUsage
      type: object
    AtomicClaim:
      additionalProperties: false
      properties:
        card_key:
          maxLength: 64
          minLength: 1
          title: Card Key
          type: string
        citations:
          items:
            maxLength: 64
            minLength: 1
            type: string
          maxItems: 2
          minItems: 1
          title: Citations
          type: array
        conditions:
          items:
            maxLength: 60
            minLength: 1
            type: string
          maxItems: 2
          title: Conditions
          type: array
        text:
          maxLength: 120
          minLength: 1
          title: Text
          type: string
        unit:
          anyOf:
          - maxLength: 20
            type: string
          - type: 'null'
          title: Unit
        value:
          anyOf:
          - maxLength: 40
            type: string
          - type: number
          - type: integer
          - type: 'null'
          title: Value
      required:
      - card_key
      - text
      - citations
      title: AtomicClaim
      type: object
    CardResult:
      properties:
        card_key:
          title: Card Key
          type: string
        card_name:
          title: Card Name
          type: string
        evidence_count:
          title: Evidence Count
          type: integer
        issuer:
          title: Issuer
          type: string
        rank:
          title: Rank
          type: integer
        score:
          title: Score
          type: number
      required:
      - card_key
      - card_name
      - issuer
      - score
      - rank
      - evidence_count
      title: CardResult
      type: object
    ErrorResponse:
      properties:
        code:
          title: Code
          type: string
        message:
          title: Message
          type: string
        request_id:
          title: Request Id
          type: string
        retryable:
          title: Retryable
          type: boolean
      required:
      - code
      - message
      - retryable
      - request_id
      title: ErrorResponse
      type: object
    EvidenceResult:
      properties:
        card_key:
          title: Card Key
          type: string
        card_name:
          title: Card Name
          type: string
        chunk_id:
          title: Chunk Id
          type: string
        issuer:
          title: Issuer
          type: string
        level:
          title: Level
          type: string
        page_num:
          title: Page Num
          type: integer
        rank:
          title: Rank
          type: integer
        score:
          title: Score
          type: number
        section:
          anyOf:
          - type: string
          - type: 'null'
          title: Section
        text:
          title: Text
          type: string
      required:
      - rank
      - card_key
      - card_name
      - issuer
      - chunk_id
      - page_num
      - text
      - section
      - level
      - score
      title: EvidenceResult
      type: object
    LiveResponse:
      properties:
        status:
          const: live
          title: Status
          type: string
      required:
      - status
      title: LiveResponse
      type: object
    NotReadyResponse:
      properties:
        reason:
          title: Reason
          type: string
        status:
          const: not_ready
          title: Status
          type: string
      required:
      - status
      - reason
      title: NotReadyResponse
      type: object
    QueryRequest:
      additionalProperties: false
      properties:
        profile:
          anyOf:
          - enum:
            - card_page_section_benefit
            - parent_child_bundle
            type: string
          - type: 'null'
          title: Profile
        query:
          maxLength: 500
          minLength: 1
          title: Query
          type: string
        top_k:
          default: 3
          enum:
          - 1
          - 3
          - 5
          title: Top K
          type: integer
      required:
      - query
      title: QueryRequest
      type: object
    ReadyResponse:
      properties:
        chunk_count:
          title: Chunk Count
          type: integer
        document_count:
          title: Document Count
          type: integer
        profile:
          enum:
          - card_page_section_benefit
          - parent_child_bundle
          title: Profile
          type: string
        release_id:
          title: Release Id
          type: string
        status:
          const: ready
          title: Status
          type: string
      required:
      - status
      - release_id
      - profile
      - document_count
      - chunk_count
      title: ReadyResponse
      type: object
    Recommendation:
      additionalProperties: false
      properties:
        card_key:
          maxLength: 64
          minLength: 1
          title: Card Key
          type: string
        citations:
          items:
            maxLength: 64
            minLength: 1
            type: string
          maxItems: 2
          minItems: 1
          title: Citations
          type: array
        reason:
          maxLength: 100
          minLength: 1
          title: Reason
          type: string
      required:
      - card_key
      - reason
      - citations
      title: Recommendation
      type: object
    SearchResponse:
      properties:
        cards:
          items:
            $ref: '#/components/schemas/CardResult'
          title: Cards
          type: array
        evidence:
          items:
            $ref: '#/components/schemas/EvidenceResult'
          title: Evidence
          type: array
        profile:
          enum:
          - card_page_section_benefit
          - parent_child_bundle
          title: Profile
          type: string
        query_type:
          enum:
          - proper_noun
          - numeric_condition
          - semantic
          title: Query Type
          type: string
        release_id:
          title: Release Id
          type: string
        status:
          const: completed
          title: Status
          type: string
        usage:
          $ref: '#/components/schemas/SearchUsage'
      required:
      - status
      - release_id
      - profile
      - query_type
      - cards
      - evidence
      - usage
      title: SearchResponse
      type: object
    SearchUsage:
      properties:
        embedding:
          additionalProperties: true
          title: Embedding
          type: object
      required:
      - embedding
      title: SearchUsage
      type: object
info:
  title: PickCardU RAG API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/answer:
    post:
      operationId: answer_v1_answer_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResponse'
          description: Successful Response
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: Answer
  /v1/health/live:
    get:
      operationId: live_v1_health_live_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
          description: Successful Response
      summary: Live
  /v1/health/ready:
    get:
      operationId: ready_v1_health_ready_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
          description: Successful Response
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReadyResponse'
          description: Service Unavailable
      summary: Ready
  /v1/search:
    post:
      operationId: search_v1_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
          description: Successful Response
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      summary: Search
