[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pickcardu-rag"
version = "0.1.0"
description = "Storage- and transport-independent PickCardU RAG core"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "openai==2.30.0",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
reranker = [
  "torch==2.11.0",
  "transformers==4.57.6",
]

[tool.setuptools.packages.find]
where = ["src"]
