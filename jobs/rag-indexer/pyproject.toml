[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pickcardu-indexer"
version = "0.1.0"
description = "Operational dual-OCR RAG index builder"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "chromadb==1.5.5",
  "openai==2.30.0",
  "PyMuPDF==1.28.0",
]

[project.scripts]
pickcardu-indexer = "pickcardu_indexer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
