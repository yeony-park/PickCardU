[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pickcardu-rag-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pickcardu-rag==0.1.0",
  "fastapi==0.136.3",
  "uvicorn==0.42.0",
  "pydantic==2.13.4",
  "numpy==2.3.5",
  "chromadb==1.5.5",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]
